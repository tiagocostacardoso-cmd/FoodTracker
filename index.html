<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dubai Grocery Price Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1110;
    --bg-grad: radial-gradient(1100px 520px at 12% -10%, #142320 0%, transparent 60%), radial-gradient(900px 460px at 100% 0%, #14231f 0%, transparent 55%), #0b1110;
    --panel:#131c1c;
    --panel2:#182323;
    --panel3:#1b2726;
    --line:#26332f;
    --line-soft:#1e2b28;
    --text:#eef4ef;
    --muted:#8ea69c;
    --muted-dim:#5f766e;
    --accent:#c6ff4d;
    --accent-dim:#8fb542;
    --accent-glow: rgba(198,255,77,0.25);
    --carrefour:#3d8bdb;
    --lulu:#e0625a;
    --warn:#e8b33d;
    --veg:#8bc34a;
    --veg-tint: rgba(139,195,74,0.16);
    --fruit:#ff9f43;
    --fruit-tint: rgba(255,159,67,0.16);
    --meat:#e0625a;
    --meat-tint: rgba(224,98,90,0.16);
    --fish:#4a9eff;
    --fish-tint: rgba(74,158,255,0.16);
    --sans: 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
    --radius: 14px;
    --shadow-lg: 0 20px 50px -12px rgba(0,0,0,0.55);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-grad);background-attachment:fixed;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent-glow);color:var(--text);}
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted-dim);}

  .topbar{height:4px;background:linear-gradient(90deg, var(--veg), var(--fruit), var(--meat), var(--fish));}
  .wrap{max-width:1320px;margin:0 auto;padding:32px 20px 64px;}

  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;padding-bottom:22px;margin-bottom:24px;border-bottom:1px solid var(--line-soft);}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg, var(--panel3), var(--panel2));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow-sm);flex:none;}
  h1{font-size:21px;letter-spacing:0.3px;margin:0 0 4px;font-weight:800;}
  .sub{color:var(--muted);font-size:12.5px;font-family:var(--mono);}
  .legend{display:flex;gap:14px;font-size:12px;font-family:var(--mono);flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:20px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 3px currentColor22;}
  .dot.carrefour{background:var(--carrefour);color:var(--carrefour);}
  .dot.lulu{background:var(--lulu);color:var(--lulu);}

  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);display:flex;align-items:center;gap:8px;transition:all .16s ease;box-shadow:var(--shadow-sm);}
  .tab:hover{border-color:var(--accent-dim);color:var(--text);transform:translateY(-1px);}
  .tab.active{background:var(--accent);color:#0d1414;border-color:var(--accent);box-shadow:0 6px 18px -4px var(--accent-glow);}
  .tab .emoji{font-size:15px;}
  .tab .count{opacity:0.65;font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,0.12);padding:1px 6px;border-radius:8px;}
  .tab.active .count{background:rgba(0,0,0,0.15);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
  input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13.5px;min-width:220px;font-family:var(--sans);transition:border-color .15s;}
  input[type=text]:focus{outline:none;border-color:var(--accent-dim);}
  select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-size:13.5px;font-family:var(--sans);}
  .btn{background:var(--accent);color:#0d1414;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:transform .12s, box-shadow .12s;box-shadow:0 6px 16px -6px var(--accent-glow);}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px var(--accent-glow);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{background:var(--panel);color:var(--accent);border:1px solid var(--accent-dim);font-weight:600;box-shadow:none;}
  .btn.secondary:hover{background:var(--panel3);}
  .spacer{flex:1;}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
  .card{background:linear-gradient(180deg, var(--panel3), var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg, var(--accent), transparent);}
  .card .label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:0.9px;font-family:var(--mono);}
  .card .value{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-0.3px;}
  .card .value small{font-size:12px;color:var(--muted);font-weight:500;}

  .table-scroll{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-lg);background:var(--panel);}
  table{width:100%;min-width:680px;border-collapse:collapse;}
  thead th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap;}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:var(--panel3);}
  .item-row{display:flex;align-items:center;gap:12px;}
  .item-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;border:1px solid rgba(255,255,255,0.06);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);}
  .item-icon.veg{background:var(--veg-tint);}
  .item-icon.fruit{background:var(--fruit-tint);}
  .item-icon.meat{background:var(--meat-tint);}
  .item-icon.fish{background:var(--fish-tint);}
  .item-text{min-width:0;}
  .item-name{font-weight:600;letter-spacing:0.1px;}
  .item-cat{color:var(--muted-dim);font-size:10.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
  .price-cell{font-family:var(--mono);cursor:pointer;position:relative;white-space:nowrap;border-radius:8px;}
  .price-cell .p{font-size:14px;}
  .price-cell.best{color:var(--accent);font-weight:700;}
  .price-cell.empty{color:var(--muted-dim);font-style:italic;font-size:12px;}
  .price-cell .ts{display:block;font-size:9.5px;color:var(--muted-dim);margin-top:2px;font-weight:400;}
  .price-cell:hover{background:rgba(198,255,77,0.06);outline:1px solid var(--accent-dim);}
  .best-badge{display:inline-flex;align-items:center;gap:2px;background:rgba(198,255,77,0.14);color:var(--accent);font-size:9.5px;padding:2px 7px;border-radius:10px;margin-left:6px;font-family:var(--mono);font-weight:700;letter-spacing:0.3px;}
  .cell-link{display:inline-block;margin-left:6px;color:var(--accent);text-decoration:none;font-weight:700;border:1px solid var(--accent-dim);border-radius:5px;width:17px;height:17px;line-height:15px;text-align:center;font-size:11px;transition:all .12s;}
  .cell-link:hover{background:var(--accent);color:#0d1414;}
  .spread{font-family:var(--mono);font-size:12px;color:var(--warn);white-space:nowrap;font-weight:600;}
  .del-row{color:var(--muted-dim);cursor:pointer;font-size:15px;transition:color .12s;}
  .del-row:hover{color:#e05555;}

  .modal-bg{position:fixed;inset:0;background:rgba(6,10,10,0.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;animation:fadeIn .15s ease;}
  .modal-bg.open{display:flex;}
  .modal{background:linear-gradient(180deg, var(--panel3), var(--panel2));border:1px solid var(--line);border-radius:16px;padding:24px;width:380px;max-width:90vw;box-shadow:var(--shadow-lg);animation:popIn .16s ease;}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:700;}
  .modal label{display:block;font-size:10.5px;color:var(--muted);margin:12px 0 5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;}
  .modal input, .modal select{width:100%;}
  .modal .actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}

  footer{margin-top:28px;color:var(--muted-dim);font-size:11.5px;font-family:var(--sans);line-height:1.7;border-top:1px solid var(--line-soft);padding-top:16px;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px;}
  .empty-state .big{font-size:32px;display:block;margin-bottom:10px;opacity:0.6;}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">🛒</div>
      <div>
        <h1>DUBAI GROCERY PRICE TRACKER</h1>
        <div class="sub">Vegetables · Fruit · Meat · Fish — AED per kg, Carrefour vs Lulu, by exact product variety</div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search item...">
    <div class="spacer"></div>
    <button class="btn secondary" id="addItemBtn">+ Add item</button>
    <button class="btn" id="exportBtn">Export CSV</button>
  </div>

  <div class="table-scroll">
    <table>
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer id="footer"></footer>
</div>

<div class="modal-bg" id="priceModalBg">
  <div class="modal">
    <h3 id="priceModalTitle">Update price</h3>
    <label>Price (AED / kg)</label>
    <input type="text" id="priceInput" inputmode="decimal" placeholder="e.g. 5.25">
    <label>Product page URL (optional)</label>
    <input type="text" id="urlInput" placeholder="https://...">
    <div class="actions">
      <button class="btn secondary" id="priceCancel">Cancel</button>
      <button class="btn" id="priceSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="itemModalBg">
  <div class="modal">
    <h3>Add item</h3>
    <label>Name (be specific — variety / cut)</label>
    <input type="text" id="newItemName" placeholder="e.g. Fuji Apple, or Ribeye Steak">
    <label>Category</label>
    <select id="newItemCat"></select>
    <div class="actions">
      <button class="btn secondary" id="itemCancel">Cancel</button>
      <button class="btn" id="itemSave">Add</button>
    </div>
  </div>
</div>

<script>
const STORES = ['carrefour','lulu'];
const STORE_LABEL = {carrefour:'Carrefour', lulu:'Lulu'};
const STORE_AIRTABLE_NAME = {carrefour:'Carrefour', lulu:'Lulu'}; // must match the Store select options in Airtable
const CATEGORIES = ['Vegetables','Fruit','Meat','Fish'];
const CATEGORY_EMOJI = {Vegetables:'🥬', Fruit:'🍎', Meat:'🥩', Fish:'🐟'};
const CATEGORY_CLASS = {Vegetables:'veg', Fruit:'fruit', Meat:'meat', Fish:'fish'};

// Cloudflare Worker URL — set this after deploying worker.js (see its header comment).
const API_BASE = 'https://grocery-price-api.tiago-costa-cardoso.workers.dev';

// Per-item icon overrides — falls back to the category emoji (CATEGORY_EMOJI)
// when an id isn't listed here, so newly added items always get an icon.
const ITEM_EMOJI = {
  'tomato-round':'🍅', 'cucumber-uae':'🥒', 'potato-local':'🥔', 'onion-red-india':'🧅',
  'garlic-white-china':'🧄', 'broccoli-spain':'🥦', 'spinach':'🥬', 'capsicum-mixed':'🫑',
  'carrot':'🥕', 'cabbage-white':'🥬', 'cauliflower':'🥦', 'eggplant':'🍆',
  'zucchini':'🥒', 'mushroom-white':'🍄',
  'apple-pink-lady':'🍎', 'banana-chiquita-ecuador':'🍌', 'lemon-south-africa':'🍋',
  'orange-valencia':'🍊', 'watermelon':'🍉', 'grapes-white-seedless':'🍇',
  'grapes-red-seedless':'🍇', 'mango':'🥭', 'strawberry':'🍓', 'avocado':'🥑',
  'chicken-breast-boneless':'🍗', 'chicken-whole-fresh':'🐔', 'beef-mince-18':'🥩',
  'lamb-chops':'🍖', 'beef-ribeye-australian':'🥩', 'beef-ribeye-south-african':'🥩',
  'lamb-leg-boneless':'🍖', 'chicken-thighs':'🍗',
  'salmon-fillet-norwegian':'🐟', 'hammour-fillet':'🐟', 'seabream-red':'🐟',
  'salmon-fillet-scottish':'🐟', 'salmon-trout-fillet':'🐟', 'tuna-steak':'🐟',
  'kingfish-steak':'🐟', 'sea-bass-whole':'🐟', 'silver-pomfret':'🐟',
};
function iconFor(it){ return ITEM_EMOJI[it.id] || CATEGORY_EMOJI[it.cat] || '🛒'; }

function emptyPrices(){
  const o = {};
  STORES.forEach(s=> o[s] = {v:null, t:null, url:null});
  return o;
}

// Item catalog — the dashboard's fixed item list. Prices come from Airtable
// (via the Worker), not from here; this just defines which rows to show.
const CATALOG = {
  items: [
    // Vegetables
    {id:'tomato-round', name:'Tomato (Round, loose)', cat:'Vegetables'},
    {id:'cucumber-uae', name:'Cucumber (UAE)', cat:'Vegetables'},
    {id:'potato-local', name:'Potato (Local/Lebanon)', cat:'Vegetables'},
    {id:'onion-red-india', name:'Onion, Red (India)', cat:'Vegetables'},
    {id:'garlic-white-china', name:'Garlic, White (China)', cat:'Vegetables'},
    {id:'broccoli-spain', name:'Broccoli (Spain)', cat:'Vegetables'},
    {id:'spinach', name:'Spinach', cat:'Vegetables'},
    {id:'capsicum-mixed', name:'Capsicum (Mixed)', cat:'Vegetables'},
    // Fruit
    {id:'apple-pink-lady', name:'Apple, Pink Lady', cat:'Fruit'},
    {id:'banana-chiquita-ecuador', name:'Banana, Chiquita (Ecuador)', cat:'Fruit'},
    {id:'lemon-south-africa', name:'Lemon (South Africa)', cat:'Fruit'},
    {id:'orange-valencia', name:'Orange, Valencia', cat:'Fruit'},
    // Meat
    {id:'chicken-breast-boneless', name:'Chicken Breast (Boneless, fillet)', cat:'Meat'},
    {id:'chicken-whole-fresh', name:'Chicken, Whole (Fresh, ~1.4kg)', cat:'Meat'},
    {id:'beef-mince-18', name:'Beef Mince (18% fat)', cat:'Meat'},
    {id:'lamb-chops', name:'Lamb Chops', cat:'Meat'},
    // Fish
    {id:'salmon-fillet-norwegian', name:'Salmon Fillet (Norwegian, fresh)', cat:'Fish'},
    {id:'hammour-fillet', name:'Hammour Fillet (fresh, local)', cat:'Fish'},
    {id:'seabream-red', name:'Red Seabream (Pagrus, whole)', cat:'Fish'},
    {id:'salmon-fillet-scottish', name:'Salmon Fillet, Scottish (fresh)', cat:'Fish'},
    {id:'salmon-trout-fillet', name:'Salmon Trout Fillet (fresh)', cat:'Fish'},
    {id:'tuna-steak', name:'Tuna Steak (fresh)', cat:'Fish'},
    {id:'kingfish-steak', name:'Kingfish Steak (fresh)', cat:'Fish'},
    {id:'sea-bass-whole', name:'Sea Bass (fresh, whole)', cat:'Fish'},
    {id:'silver-pomfret', name:'Silver Pomfret (fresh, whole)', cat:'Fish'},
    // Meat (additional)
    {id:'beef-ribeye-australian', name:'Beef Ribeye Steak, Australian (fresh)', cat:'Meat'},
    {id:'beef-ribeye-south-african', name:'Beef Ribeye Steak, South African (fresh)', cat:'Meat'},
    {id:'lamb-leg-boneless', name:'Lamb Leg (Boneless, fresh)', cat:'Meat'},
    {id:'chicken-thighs', name:'Chicken Thighs (fresh)', cat:'Meat'},
    // Vegetables (additional)
    {id:'carrot', name:'Carrot (fresh, loose)', cat:'Vegetables'},
    {id:'cabbage-white', name:'Cabbage, White (fresh)', cat:'Vegetables'},
    {id:'cauliflower', name:'Cauliflower (fresh)', cat:'Vegetables'},
    {id:'eggplant', name:'Eggplant (fresh)', cat:'Vegetables'},
    {id:'zucchini', name:'Zucchini (fresh)', cat:'Vegetables'},
    {id:'mushroom-white', name:'Mushroom, White (fresh)', cat:'Vegetables'},
    // Fruit (additional)
    {id:'watermelon', name:'Watermelon, Seedless (fresh)', cat:'Fruit'},
    {id:'grapes-white-seedless', name:'Grapes, White Seedless (fresh)', cat:'Fruit'},
    {id:'grapes-red-seedless', name:'Grapes, Red Seedless (fresh)', cat:'Fruit'},
    {id:'mango', name:'Mango (fresh)', cat:'Fruit'},
    {id:'strawberry', name:'Strawberry (fresh)', cat:'Fruit'},
    {id:'avocado', name:'Avocado (fresh)', cat:'Fruit'},
  ]
};

// Item name (as shown/sent) must match the "Item" select option text in
// Airtable exactly, since that's how records get matched back to a row here.
const ITEM_BY_NAME = {};
CATALOG.items.forEach(it => ITEM_BY_NAME[it.name] = it.id);

let state = null;
let editing = null;
let activeCat = 'Vegetables';

async function apiGet(){
  const res = await fetch(`${API_BASE}/api/prices`);
  if(!res.ok) throw new Error(`API GET failed: ${res.status}`);
  return res.json();
}

async function apiPost(payload){
  const res = await fetch(`${API_BASE}/api/prices`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  if(!res.ok) throw new Error(`API POST failed: ${res.status}`);
  return res.json();
}

async function loadState(){
  state = { items: CATALOG.items.map(it => ({...it})), prices: {} };
  state.items.forEach(it => state.prices[it.id] = emptyPrices());

  try{
    const { records } = await apiGet();
    // Keep only the latest record per item+store (Airtable holds full daily history).
    const latest = {}; // key: itemId|store -> {date, record}
    records.forEach(r => {
      const f = r.fields;
      const itemId = ITEM_BY_NAME[f['Item']];
      const store = Object.keys(STORE_AIRTABLE_NAME).find(s => STORE_AIRTABLE_NAME[s] === f['Store']);
      if(!itemId || !store || !state.prices[itemId]) return;
      const key = `${itemId}|${store}`;
      if(!latest[key] || f['Date'] > latest[key].date){
        latest[key] = { date: f['Date'], price: f['Price AED/kg'], url: f['Product URL'] || null };
      }
    });
    Object.entries(latest).forEach(([key, val]) => {
      const [itemId, store] = key.split('|');
      state.prices[itemId][store] = { v: val.price, t: val.date, url: val.url };
    });
  }catch(e){
    console.error('Failed to load prices from API', e);
    document.getElementById('footer').innerHTML =
      `Could not reach the price API (${e.message}). Check that API_BASE in this page points to your deployed Worker, and that the Worker is running.`;
  }
}

function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d)) return ts;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

function bestStore(itemId){
  let best = null, bestVal = Infinity;
  STORES.forEach(s=>{
    const p = state.prices[itemId][s];
    if(p && p.v!=null && p.v < bestVal){ bestVal = p.v; best = s; }
  });
  return best;
}

function renderLegend(){
  document.getElementById('legend').innerHTML = STORES.map(s=>
    `<span><i class="dot ${s}"></i>${STORE_LABEL[s]}</span>`).join('');
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = CATEGORIES.map(c=>{
    const n = state.items.filter(i=>i.cat===c).length;
    return `<div class="tab ${c===activeCat?'active':''}" data-cat="${c}"><span class="emoji">${CATEGORY_EMOJI[c]}</span>${c}<span class="count">${n}</span></div>`;
  }).join('');
  el.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ activeCat = t.dataset.cat; render(); });
  });
}

function renderSummary(){
  const el = document.getElementById('summary');
  const inCat = state.items.filter(i=>i.cat===activeCat);
  let tracked = 0, gaps = 0, avgSpread = [];
  inCat.forEach(it=>{
    const vals = STORES.map(s=>state.prices[it.id][s]).filter(p=>p && p.v!=null).map(p=>p.v);
    if(vals.length) tracked++;
    gaps += (STORES.length - vals.length);
    if(vals.length>=2) avgSpread.push(Math.max(...vals)-Math.min(...vals));
  });
  const avg = avgSpread.length ? (avgSpread.reduce((a,b)=>a+b,0)/avgSpread.length).toFixed(2) : '—';
  el.innerHTML = `
    <div class="card"><div class="label">Items in ${activeCat}</div><div class="value">${inCat.length}</div></div>
    <div class="card"><div class="label">Price points logged</div><div class="value">${STORES.length*inCat.length - gaps} <small>/ ${STORES.length*inCat.length}</small></div></div>
    <div class="card"><div class="label">Avg. price spread</div><div class="value">AED ${avg} <small>per kg</small></div></div>
    <div class="card"><div class="label">Missing data points</div><div class="value">${gaps}</div></div>
  `;
}

function renderTableHead(){
  const row = document.getElementById('theadRow');
  row.innerHTML = `<th style="width:28%">Item</th>` +
    STORES.map(s=>`<th>${STORE_LABEL[s]}</th>`).join('') +
    `<th>Spread</th><th></th>`;
}

function renderTable(){
  const tbody = document.getElementById('tbody');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const rows = state.items.filter(it=>{
    if(it.cat !== activeCat) return false;
    if(q && !it.name.toLowerCase().includes(q)) return false;
    return true;
  });
  rows.sort((a,b)=>a.name.localeCompare(b.name));

  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="${STORES.length+3}"><div class="empty-state"><span class="big">🔍</span>No items match. Try clearing the search or adding one.</div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(it=>{
    const best = bestStore(it.id);
    const vals = STORES.map(s=>state.prices[it.id][s]).filter(p=>p&&p.v!=null).map(p=>p.v);
    const spread = vals.length>=2 ? (Math.max(...vals)-Math.min(...vals)).toFixed(2) : '—';
    const cells = STORES.map(s=>{
      const p = state.prices[it.id][s];
      const isBest = s === best;
      if(!p || p.v==null){
        return `<td class="price-cell empty" data-item="${it.id}" data-store="${s}">— add</td>`;
      }
      const linkHtml = p.url
        ? `<a class="cell-link" href="${p.url}" target="_blank" rel="noopener" title="Open product page" onclick="event.stopPropagation()">↗</a>`
        : '';
      return `<td class="price-cell ${isBest?'best':''}" data-item="${it.id}" data-store="${s}">
        <span class="p">AED ${p.v.toFixed(2)}</span>${isBest?'<span class="best-badge">✓ BEST</span>':''}${linkHtml}
        <span class="ts">${fmtDate(p.t)}</span>
      </td>`;
    }).join('');
    return `<tr>
      <td>
        <div class="item-row">
          <div class="item-icon ${CATEGORY_CLASS[it.cat]}">${iconFor(it)}</div>
          <div class="item-text">
            <div class="item-name">${it.name}</div>
            <div class="item-cat">${it.cat}</div>
          </div>
        </div>
      </td>
      ${cells}
      <td class="spread">${spread!=='—'?'AED '+spread:'—'}</td>
      <td class="del-row" data-del="${it.id}" title="Hide from dashboard (keeps Airtable history)">✕</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.price-cell').forEach(td=>{
    td.addEventListener('click', ()=>openPriceModal(td.dataset.item, td.dataset.store));
  });
  tbody.querySelectorAll('[data-del]').forEach(td=>{
    td.addEventListener('click', ()=>removeItem(td.dataset.del));
  });
}

function renderFooter(){
  document.getElementById('footer').innerHTML =
    `Prices are entered manually — click any cell to log today's price; it's saved as a new dated row in
    Airtable, so history is kept rather than overwritten. Item names are kept to a specific variety/cut
    so comparisons stay apples-to-apples — when adding an item, name the exact type (e.g. "Fuji Apple",
    not just "Apple"). Click a price to log it, and optionally paste the product page URL — a small ↗
    then links straight to that listing. Carrefour and Lulu are the only two stores tracked since both
    run rendered category pages real prices could be pulled from. Data is stored in Airtable via a
    Cloudflare Worker proxy, so it syncs across devices — "Hide" removes an item from this view only,
    the underlying history stays in Airtable.`;
}

function render(){
  renderLegend();
  renderTabs();
  renderSummary();
  renderTableHead();
  renderTable();
  renderFooter();
}

function openPriceModal(itemId, store){
  editing = {itemId, store};
  const it = state.items.find(i=>i.id===itemId);
  document.getElementById('priceModalTitle').textContent = `${it.name} — ${STORE_LABEL[store]}`;
  const existing = state.prices[itemId][store];
  document.getElementById('priceInput').value = existing && existing.v!=null ? existing.v : '';
  document.getElementById('urlInput').value = existing && existing.url ? existing.url : '';
  document.getElementById('priceModalBg').classList.add('open');
  document.getElementById('priceInput').focus();
}
function closePriceModal(){
  document.getElementById('priceModalBg').classList.remove('open');
  editing = null;
}
async function savePriceModal(){
  const raw = document.getElementById('priceInput').value.trim();
  const urlRaw = document.getElementById('urlInput').value.trim();
  if(!editing) return;
  const {itemId, store} = editing;
  if(raw === ''){
    // Clearing a price locally only hides it in this session — Airtable keeps
    // the historical record. To truly remove it, delete the row in Airtable.
    state.prices[itemId][store] = {v:null, t:null, url:null};
    closePriceModal();
    render();
    return;
  }
  const num = parseFloat(raw);
  if(isNaN(num) || num < 0){ alert('Enter a valid price'); return; }
  let url = urlRaw || null;
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;

  const it = state.items.find(i=>i.id===itemId);
  const today = new Date().toISOString().slice(0,10);
  try{
    await apiPost({
      store: STORE_AIRTABLE_NAME[store],
      item: it.name,
      category: it.cat,
      price: num,
      url: url || undefined,
      date: today,
    });
    state.prices[itemId][store] = {v:num, t:today, url};
  }catch(e){
    alert(`Could not save to the price API: ${e.message}`);
    return;
  }
  closePriceModal();
  render();
}

async function removeItem(itemId){
  if(!confirm('Hide this item from the dashboard? (Its price history stays in Airtable.)')) return;
  state.items = state.items.filter(i=>i.id!==itemId);
  delete state.prices[itemId];
  render();
}

function openItemModal(){
  document.getElementById('newItemName').value='';
  const sel = document.getElementById('newItemCat');
  sel.innerHTML = CATEGORIES.map(c=>`<option value="${c}" ${c===activeCat?'selected':''}>${c}</option>`).join('');
  document.getElementById('itemModalBg').classList.add('open');
  document.getElementById('newItemName').focus();
}
function closeItemModal(){
  document.getElementById('itemModalBg').classList.remove('open');
}
async function saveNewItem(){
  const name = document.getElementById('newItemName').value.trim();
  const cat = document.getElementById('newItemCat').value;
  if(!name){ alert('Enter an item name'); return; }
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36);
  state.items.push({id, name, cat});
  state.prices[id] = emptyPrices();
  ITEM_BY_NAME[name] = id;
  activeCat = cat;
  closeItemModal();
  render();
}

function exportCSV(){
  const rows = [['Item','Category', ...STORES.flatMap(s=>[STORE_LABEL[s]+' (AED/kg)', STORE_LABEL[s]+' URL']), 'Best store']];
  const sortedItems = [...state.items].sort((a,b)=> a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));
  sortedItems.forEach(it=>{
    const best = bestStore(it.id);
    rows.push([
      it.name, it.cat,
      ...STORES.flatMap(s=> [state.prices[it.id][s].v ?? '', state.prices[it.id][s].url ?? '']),
      best ? STORE_LABEL[best] : ''
    ]);
  });
  const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dubai-grocery-prices.csv';
  a.click();
  URL.revokeObjectURL(url);
}

async function init(){
  await loadState();
  render();

  document.getElementById('search').addEventListener('input', renderTable);
  document.getElementById('addItemBtn').addEventListener('click', openItemModal);
  document.getElementById('exportBtn').addEventListener('click', exportCSV);

  document.getElementById('priceCancel').addEventListener('click', closePriceModal);
  document.getElementById('priceSave').addEventListener('click', savePriceModal);
  document.getElementById('priceInput').addEventListener('keydown', e=>{ if(e.key==='Enter') savePriceModal(); });
  document.getElementById('priceModalBg').addEventListener('click', e=>{ if(e.target.id==='priceModalBg') closePriceModal(); });

  document.getElementById('itemCancel').addEventListener('click', closeItemModal);
  document.getElementById('itemSave').addEventListener('click', saveNewItem);
  document.getElementById('itemModalBg').addEventListener('click', e=>{ if(e.target.id==='itemModalBg') closeItemModal(); });
}

init();
</script>
</body>
</html>
